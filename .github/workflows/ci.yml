name: CI

# 只做：依赖安装 → 类型检查 → 离线测试 → 构建。
# 明确不做：不使用任何私有 Token、不连接真实 MCP、不创建任何真实订单。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Offline unit tests (demo mode, no MCP / no token)
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepublish safety check
        run: bash scripts/prepublish-check.sh
